version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directories:
      - "/"
      - "/benchmark"
      - "/leaderboard-client"
      - "/leaderboard-server"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"
