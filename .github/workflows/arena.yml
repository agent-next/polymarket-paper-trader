name: Forecast Arena

# Daily: resolve past forecasts, record new ones, rebuild and deploy the public page.
# Data lives on the append-only `arena-data` branch; the page is served by Cloudflare Pages
# (project forecast-arena). GitHub Pages is still deployed on every run as the rollback target.
on:
  schedule:
    - cron: "17 6 * * *"
    # Backup pass: GitHub delayed the 06:17 schedule by ~7h on 2026-09-28/29;
    # both runs are idempotent and serialize on the arena concurrency group.
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # push forecasts to arena-data (accepted risk: token is repo-wide)
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out arena-data (created on first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token is passed per command (never stored in data/.git/config), because
          # third-party pip/LLM code runs later in this job.
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          if git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code --heads "$url" arena-data >/dev/null; then
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" clone --quiet --single-branch --branch arena-data "$url" data
          else
            git init --quiet -b arena-data data && git -C data remote add origin "$url"
          fi
          git -C data config user.name "forecast-arena[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e . -e ./benchmark
      - name: Resolve and predict
        env:
          # litellm requires a key; Zen's free tier accepts only "public" (or no
          # Authorization header) and rejects any other value with 401.
          ZEN_API_KEY: public
        run: |
          rows_before=$(cat data/forecasts/*.jsonl 2>/dev/null | wc -l)
          resolve_rc=0; predict_rc=0
          polymarket-benchmark arena resolve --data data || resolve_rc=$?
          [ "$resolve_rc" -eq 0 ] || echo "::warning::resolve failed (rc=$resolve_rc)"
          polymarket-benchmark arena predict --data data || predict_rc=$?
          [ "$predict_rc" -eq 0 ] || echo "::warning::predict failed (rc=$predict_rc, partial results kept)"
          {
            echo "ARENA_ROWS_BEFORE=$rows_before"
            echo "ARENA_RESOLVE_RC=$resolve_rc"
            echo "ARENA_PREDICT_RC=$predict_rc"
          } >> "$GITHUB_ENV"
      - name: Commit data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit --quiet -m "arena: $(date -u +%Y-%m-%d) run ${GITHUB_RUN_ID}"
          # Runs are serialized by the concurrency group, so a plain push cannot race.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push --quiet origin arena-data
      - name: Build site
        run: polymarket-benchmark arena build --data data --out site
      - id: pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        continue-on-error: true  # a Cloudflare failure must not block the GitHub Pages rollback
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: pages deploy site --project-name=forecast-arena --branch=main
      - name: Fail the run when predict produced nothing
        # Partial results are kept and deployed above; a run that failed outright is red.
        run: |
          rows_after=$(cat data/forecasts/*.jsonl 2>/dev/null | wc -l)
          echo "forecast rows: before=${ARENA_ROWS_BEFORE} after=${rows_after} resolve_rc=${ARENA_RESOLVE_RC} predict_rc=${ARENA_PREDICT_RC}"
          if [ "$ARENA_PREDICT_RC" -ne 0 ] && [ "$rows_after" -le "$ARENA_ROWS_BEFORE" ]; then
            echo "::error::predict failed and produced no new forecast rows"
            exit 1
          fi

  deploy:
    needs: run
    # The guard step can fail the run after the site artifact exists; still deploy it.
    if: ${{ !cancelled() && needs.run.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
