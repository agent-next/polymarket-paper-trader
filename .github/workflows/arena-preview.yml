name: Forecast Arena preview

# Renders the page from the live arena-data branch with the PR's code and deploys it to a
# Cloudflare Pages preview URL (shown in the job summary). The build job runs the PR's code
# without secrets; only the deploy job holds the Cloudflare token, and it runs no PR code.
# The same-repo guard keeps fork PRs out of the deploy.
on:
  pull_request:
    paths:
      - "benchmark/pm_benchmark/arena*.py"
      - ".github/workflows/arena-preview.yml"

permissions:
  contents: read

concurrency:
  group: arena-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena-data
          path: data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e . -e ./benchmark
      - run: polymarket-benchmark arena build --data data --out site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          retention-days: 3

  deploy:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: Allow only the static page files
        run: |
          extra=$(find site -mindepth 1 ! -name index.html ! -name data.json ! -name CNAME)
          if [ -n "$extra" ]; then echo "::error::unexpected files in site/: $extra"; exit 1; fi
      - name: Deploy preview
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: pages deploy site --project-name=forecast-arena --branch=pr-${{ github.event.pull_request.number }}
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Preview: ${URL:-not deployed (no CLOUDFLARE_API_TOKEN secret)}" >> "$GITHUB_STEP_SUMMARY"
