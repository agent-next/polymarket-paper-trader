name: Forecast Arena preview

# Renders the page from the live arena-data branch with the PR's code and deploys it to a
# Cloudflare Pages preview URL (shown in the job summary). Same-repo PRs only: forks get no
# secrets.
on:
  pull_request:
    paths:
      - "benchmark/pm_benchmark/arena*.py"
      - ".github/workflows/arena-preview.yml"

permissions:
  contents: read

concurrency:
  group: arena-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena-data
          path: data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e . -e ./benchmark
      - run: polymarket-benchmark arena build --data data --out site
      - name: Deploy preview
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: pages deploy site --project-name=forecast-arena --branch=pr-${{ github.event.pull_request.number }}
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Preview: ${URL:-not deployed (no CLOUDFLARE_API_TOKEN secret)}" >> "$GITHUB_STEP_SUMMARY"
