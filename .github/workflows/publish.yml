name: Publish

on:
  push:
    tags:
      - "v*"

# One publish per tag. GitHub occasionally delivers a duplicated tag-push event
# (observed 2026-09-23 on v0.3.0 — two concurrent runs each lost the channel the
# other won, marking both runs failed while all artifacts did publish).
# Semantics: cancel-in-progress cancels the EARLIER in-flight run when a new one
# enters the group. For the observed near-simultaneous duplication both runs are
# still in the test matrix when the second arrives, so the first cancels before
# any publishing side effect — exactly what we want. Residual risk (accepted): a
# duplicate arriving DURING the publish jobs would cancel mid-flight; channels
# already uploaded do not roll back. Event duplication is near-simultaneous, so
# that window is not the observed failure class.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -m pytest tests/ -x -q -m "not live"
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: python -m pytest tests/ -x -q -m "not live" --cov=pm_trader --cov-report=term-missing --cov-fail-under=100

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Tag matches package version
        run: |
          ls dist/ | grep -q "^polymarket_paper_trader-${GITHUB_REF_NAME#v}-py3-none-any.whl$" \
            || { echo "tag $GITHUB_REF_NAME does not match built wheel: $(ls dist/)"; exit 1; }

      - name: Outsider smoke test on the exact artifact
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv user && user/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          PATH="$PWD/user/bin:$PATH" user/bin/python "$GITHUB_WORKSPACE/scripts/outsider_smoke.py" "${GITHUB_REF_NAME#v}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-clawhub:
    needs: publish-pypi  # the skill installs the package from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to ClawHub
        run: |
          npx clawhub@0.23.3 login --token "$CLAWHUB_TOKEN" --no-browser
          npx clawhub@0.23.3 publish skill/polymarket-paper-trader \
            --version "${{ steps.version.outputs.VERSION }}" \
            --changelog "Release ${{ github.ref_name }}"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

  release:
    needs: [test]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

  verify-pypi:
    # Close the loop: install the released version from PyPI like a new user would.
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the released version from PyPI
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv user
          for i in $(seq 1 20); do  # the index can lag the upload by a few minutes
            user/bin/pip install --no-cache-dir "polymarket-paper-trader==${GITHUB_REF_NAME#v}" && break
            sleep 30
          done
          user/bin/pip show polymarket-paper-trader
      - name: Outsider smoke test on the PyPI release
        working-directory: ${{ runner.temp }}
        run: PATH="$PWD/user/bin:$PATH" user/bin/python "$GITHUB_WORKSPACE/scripts/outsider_smoke.py" "${GITHUB_REF_NAME#v}"
