name: Live API monitor

# Weekly verification loop against the real Polymarket APIs (Gamma + CLOB).
# The unit suite (test.yml) mocks all HTTP; this run is the only automated
# check that a upstream API change has not broken the live path. The e2e
# tests skip gracefully when live data is unavailable.

on:
  schedule:
    - cron: "23 9 * * 1" # Mondays 09:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]" -e "./benchmark[dev]"

      - name: Run live e2e suite
        run: python -m pytest tests/test_e2e_live.py -m live -q --tb=short

      - name: Run live benchmark checks (arena resolution)
        working-directory: benchmark
        run: python -m pytest tests/ -m live -q --tb=short -p no:cacheprovider --no-cov
