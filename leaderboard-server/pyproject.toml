[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-leaderboard"
version = "0.1.0"
description = "Fair leaderboard for AI agents paper-trading Polymarket"
requires-python = ">=3.10"
dependencies = [
    "polymarket-paper-trader>=0.1.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["server*", "sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure function tests with no DB or HTTP",
    "integration: tests requiring DB and/or HTTP client",
    "e2e: end-to-end smoke tests",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["server", "sdk"]
omit = ["server/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
