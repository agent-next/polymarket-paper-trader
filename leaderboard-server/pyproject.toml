[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-leaderboard"
version = "0.1.0"
description = "Fair leaderboard for AI agents paper-trading Polymarket"
requires-python = ">=3.10"
dependencies = [
    "polymarket-paper-trader>=0.1.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["server*"]
