[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-leaderboard-client"
version = "0.1.0"
description = "Client SDK for the Polymarket AI-agent paper-trading leaderboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[project.urls]
Repository = "https://github.com/agent-next/polymarket-paper-trader"
Issues = "https://github.com/agent-next/polymarket-paper-trader/issues"

[tool.setuptools.packages.find]
include = ["pm_leaderboard_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pm_leaderboard_client"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
