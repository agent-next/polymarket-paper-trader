# Forecast Arena entrants — loaded by pm_benchmark.arena (see benchmark/README.md).
# kind: ai entrants are queried via providers.query_model (litellm) or the Jev
# System One endpoint; kind: baseline entrants are deterministic rules
# (crowd, coin, favorite). web_access/cutoff are disclosure metadata shown on
# the public board; cutoffs are the vendors' published values, null when unpublished.
# GitHub Models ids are openai/<publisher>/<model>: litellm strips the leading
# openai/ (provider) and models.github.ai expects <publisher>/<model>.
entrants:
  - id: jev
    label: Jev 1.13 (free)
    kind: ai
    model: opencode/jev-1.13-free
    web_access: null        # not documented by TypeSafe
    cutoff: null            # not published
  - id: gpt-4.1
    label: GPT-4.1
    kind: ai
    model: openai/openai/gpt-4.1
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: "2024-06"       # openai.com/index/gpt-4-1
  - id: deepseek-v3
    label: DeepSeek V3 0324
    kind: ai
    model: openai/deepseek/DeepSeek-V3-0324
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: null            # not published
  - id: llama-4-maverick
    label: Llama 4 Maverick
    kind: ai
    model: openai/meta/Llama-4-Maverick-17B-128E-Instruct-FP8
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: "2024-08"       # Meta Llama 4 model card
  - id: grok-3-mini
    label: Grok 3 Mini
    kind: ai
    model: openai/xai/grok-3-mini
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: null            # no xAI-published value; third-party sources disagree
  - id: crowd
    label: Crowd (market price)
    kind: baseline
  - id: coin
    label: Coin flip (0.5)
    kind: baseline
  - id: favorite
    label: Favorite (0.9)
    kind: baseline
