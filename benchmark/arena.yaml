# Forecast Arena entrants — loaded by pm_benchmark.arena (see benchmark/README.md).
# kind: ai entrants are queried via providers.query_model (litellm) or the Jev
# System One endpoint; kind: baseline entrants are deterministic rules
# (crowd, coin, favorite). web_access/cutoff are disclosure metadata shown on
# the public board; cutoffs are best-known public values.
entrants:
  - id: jev
    label: Jev 1.13 (free)
    kind: ai
    model: opencode/jev-1.13-free
    web_access: false
    cutoff: null            # TypeSafe System One; no public cutoff
  - id: gpt-4.1
    label: GPT-4.1
    kind: ai
    model: openai/gpt-4.1
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: "2024-06"
  - id: deepseek-v3
    label: DeepSeek V3 0324
    kind: ai
    model: openai/DeepSeek-V3-0324
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
    cutoff: "2024-07"
  - id: llama-4-maverick
    label: Llama 4 Maverick
    kind: ai
    model: openai/Llama-4-Maverick-17B-128E-Instruct-FP8
    api_base: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    web_access: false
